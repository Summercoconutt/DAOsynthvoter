# Merge over configs/default.yaml for a minimal paired 08/08b smoke run.
#
# Or use scripts/09_run_detection_mode.py --smoke-train

behaviour_model:
  pretrained: "distilroberta-base"
  text_mode: "title"
  window: 3
  max_length: 96
  batch_size: 4
  epochs: 1
  lr: 2.0e-5
  max_grad_norm: 1.0
  max_train_windows: 320
  max_valid_windows: 96
  max_test_windows: 0
